name: Continuous Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Chouga-online/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Chouga-online

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: Chouga-online/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: Registrar resumo do SSG
        shell: bash
        run: |
          MANIFEST_PATH="dist/ssg-manifest.json"

          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::Manifesto do SSG não encontrado em $MANIFEST_PATH"
            exit 1
          fi

          STATIC_ROUTES=$(node -p "require('./$MANIFEST_PATH').staticRoutes.length")
          PRODUCT_ROUTES=$(node -p "require('./$MANIFEST_PATH').productRoutes.length")
          TOTAL_ROUTES=$(node -p "require('./$MANIFEST_PATH').totalRoutes")

          {
            echo "## Build estático da Chouga"
            echo ""
            echo "| Tipo | Quantidade |"
            echo "| --- | ---: |"
            echo "| Rotas fixas | $STATIC_ROUTES |"
            echo "| Rotas de produtos | $PRODUCT_ROUTES |"
            echo "| Total de rotas | $TOTAL_ROUTES |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: Chouga-online/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
